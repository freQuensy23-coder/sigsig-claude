[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigsig"
version = "0.1.0"
description = "Async Python client for Signal (Telethon-style API, no signal-cli wrapper)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "sigsig contributors" }]
keywords = ["signal", "messenger", "async", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "protobuf>=5.27",
    "cryptography>=42.0",
    "pynacl>=1.5",
    "qrcode[pil]>=7.4",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "sigsig_libsignal",
]

[tool.uv.sources]
sigsig_libsignal = { path = "rust/sigsig_libsignal", editable = true }

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
    "pytest-cov>=5.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "grpcio-tools>=1.60",
]

[project.scripts]
sigsig = "sigsig.cli:app"

[project.urls]
Source = "https://github.com/example/sigsig"

[tool.hatch.build.targets.wheel]
packages = ["src/sigsig"]

[tool.hatch.build.targets.wheel.force-include]
"src/sigsig/certs/signal_ca.pem" = "sigsig/certs/signal_ca.pem"

[tool.hatch.build.targets.sdist]
include = ["src", "proto", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "e2e: marks end-to-end tests against a real Signal server (require SIGSIG_E2E=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
