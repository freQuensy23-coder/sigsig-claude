[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "sigsig_libsignal"
version = "0.1.0"
description = "libsignal-protocol bindings for sigsig"
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "sigsig_libsignal._libsignal"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
